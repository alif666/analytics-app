services:
  dbservice:
    image: mysql:latest
    container_name: jobportaldb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jobportal
    volumes:
      - type: bind
        source: C:/docker-data/jobportal-mysql
        target: /var/lib/mysql