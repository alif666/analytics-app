spring.application.name=analytics
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
#logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.alif.analytics=${LOG_LEVEL:INFO}

logging.group.analytics_error=com.alif.analytics.security,com.alif.analytics.auth,com.alif.analytics.user
logging.level.analytics_error=${LOG_LEVEL_ERROR:ERROR}

#logging.file.name=logs/analytics.log
#logging.pattern.file={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","logger":"%c","message":"%m"}

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:analytics}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.default_batch_fetch_size=${DEFAULT_BATCH_FETCH_SIZE:50}
spring.jpa.defer-datasource-initialization=true

#spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:analytics;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
#spring.datasource.username=${DATABASE_USERNAME:sa}
#spring.datasource.password=${DATABASE_PASSWORD:}
#spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.sql.init.mode=always

# Original meter uploads are retained here; override for production storage.
analytics.meter.upload-directory=${METER_UPLOAD_DIRECTORY:uploads/meter}
spring.servlet.multipart.max-file-size=${METER_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${METER_MAX_FILE_SIZE:10MB}

spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.start.command=up
spring.docker.compose.stop.command=stop

